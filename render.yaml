# Render Blueprint: deploys the Express API from /server
# Render dashboard > New > Blueprint > pick this repository
services:
  - type: web
    name: scrumflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false # your Netlify URL, e.g. https://<your-site-name>.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false # Resend API key (send-only); never commit the value
      - key: EMAIL_FROM
        value: ScrumFlow <onboarding@resend.dev> # use your verified domain once it's set up in Resend
      # Optional features, hidden in the app until set (never commit the values)
      - key: CLOUDINARY_URL
        sync: false # attachments: cloudinary://<key>:<secret>@<cloud>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: BITBUCKET_CLIENT_ID
        sync: false
      - key: BITBUCKET_CLIENT_SECRET
        sync: false
